name: Web smoke (G1/G2)

on:
  push:
    branches: [ main ]
    paths:
      - "infra/cloudflare/**"
      - ".github/workflows/web-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble smoke site (placeholder + security headers)
        run: |
          mkdir -p build/web
          cp infra/cloudflare/smoke/index.html build/web/index.html
          cp infra/cloudflare/_headers build/web/_headers
          echo "--- _headers ---"
          cat build/web/_headers

      - name: Assert COOP/COEP present
        run: |
          grep -q "Cross-Origin-Opener-Policy: same-origin" build/web/_headers
          grep -q "Cross-Origin-Embedder-Policy: require-corp" build/web/_headers

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=tactical-voxel-shooter

      - name: Skip notice
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set — deployment skipped (expected until secrets are configured)."
